<svg width="1800" height="1300" viewBox="0 0 1800 1300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Tutu App black and white card stack checkbox logo concepts</title>
  <rect width="1800" height="1300" fill="#FFFFFF"/>

  <style>
    .title { font: 760 54px -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #050505; letter-spacing: 0; }
    .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #3f3f3f; letter-spacing: 0; }
    .card { fill: #FFFFFF; stroke: #D9D9D9; stroke-width: 1.5; }
    .label { font: 720 23px -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #050505; letter-spacing: 0; }
    .note { font: 400 17px -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #4D4D4D; letter-spacing: 0; }
    .black { fill: #050505; }
    .strokeWhite { stroke: #FFFFFF; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
    .strokeBlack { stroke: #050505; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <text x="96" y="100" class="title">Tutu stacked-card checkbox mark</text>
  <text x="98" y="142" class="subtitle">Closer to the reference: staggered partition cards, a bottom task layer, and a small checkbox concept.</text>

  <rect x="96" y="205" width="496" height="440" rx="24" class="card"/>
  <rect x="652" y="205" width="496" height="440" rx="24" class="card"/>
  <rect x="1208" y="205" width="496" height="440" rx="24" class="card"/>
  <rect x="96" y="715" width="496" height="440" rx="24" class="card"/>
  <rect x="652" y="715" width="496" height="440" rx="24" class="card"/>
  <rect x="1208" y="715" width="496" height="440" rx="24" class="card"/>

  <!-- A: closest structure, bottom-left checkbox -->
  <g transform="translate(96 205)">
    <g transform="translate(122 48) scale(0.78)">
      <path class="black" d="M96 28h166c55 0 82 28 82 82v142H52V72c0-24 20-44 44-44Z"/>
      <path d="M50 126c54-24 156 6 245 14 45 4 78 29 83 75l9 83H28V171c0-28 16-42 22-45Z" fill="#FFFFFF"/>
      <path class="black" d="M54 114c56-18 155 7 239 14 51 4 82 34 82 86v81H28V158c0-25 12-39 26-44Z"/>
      <path d="M28 230c66-26 155-15 238-26 76-10 119 26 119 80v43H28v-97Z" fill="#FFFFFF"/>
      <path class="black" d="M28 218c70-22 153-12 235-23 76-10 120 22 120 78 0 53-34 78-87 78H80c-35 0-52-21-52-54v-79Z"/>
      <path class="strokeWhite" d="M77 281l35 34 72-80"/>
    </g>
    <text x="58" y="342" class="label">A. Closest Stack</text>
    <text x="58" y="377" class="note">Most faithful to your screenshot: left checkbox, three staggered cards.</text>
  </g>

  <!-- B: clean logo, bottom-right checkbox -->
  <g transform="translate(652 205)">
    <g transform="translate(122 48) scale(0.78)">
      <path class="black" d="M102 30h164c55 0 82 28 82 82v143H57V73c0-24 20-43 45-43Z"/>
      <path d="M56 124c59-19 151 7 242 12 51 3 82 30 86 80l6 80H30V166c0-23 12-37 26-42Z" fill="#FFFFFF"/>
      <path class="black" d="M58 112c58-15 153 8 239 13 51 3 81 32 81 83v84H30V154c0-23 12-37 28-42Z"/>
      <path d="M30 232c66-25 159-14 243-25 76-10 116 23 116 76v46H30v-97Z" fill="#FFFFFF"/>
      <path class="black" d="M30 220c70-22 158-12 240-23 75-9 118 22 118 78 0 53-34 78-87 78H82c-34 0-52-21-52-54v-79Z"/>
      <rect x="266" y="258" width="62" height="62" rx="19" fill="#FFFFFF"/>
      <path class="strokeBlack" d="M281 289l15 15 34-39"/>
    </g>
    <text x="58" y="342" class="label">B. Right Check</text>
    <text x="58" y="377" class="note">Cleaner brand read; checkbox becomes a compact corner signal.</text>
  </g>

  <!-- C: stronger card edges -->
  <g transform="translate(1208 205)">
    <g transform="translate(122 48) scale(0.78)">
      <path class="black" d="M95 28h168c56 0 84 29 84 85v140H52V73c0-25 19-45 43-45Z"/>
      <path d="M52 121c58-21 154 7 242 14 49 4 80 31 83 79l5 79H28V163c0-24 11-37 24-42Z" fill="#FFFFFF"/>
      <path class="black" d="M54 108c62-17 151 7 241 13 52 4 82 34 82 84v83H28V153c0-23 12-38 26-45Z"/>
      <path d="M28 228c68-22 157-15 239-25 73-9 118 18 122 72l4 56H28V228Z" fill="#FFFFFF"/>
      <path class="black" d="M28 215c70-19 156-12 237-22 78-9 122 20 122 77 0 56-35 82-91 82H81c-34 0-53-21-53-55v-82Z"/>
      <circle cx="92" cy="290" r="38" fill="#FFFFFF"/>
      <path class="strokeBlack" d="M74 289l15 15 34-38"/>
    </g>
    <text x="58" y="342" class="label">C. Check Badge</text>
    <text x="58" y="377" class="note">More explicit checkbox, still integrated into the bottom card.</text>
  </g>

  <!-- D: pure silhouette with negative square checkbox -->
  <g transform="translate(96 715)">
    <g transform="translate(122 48) scale(0.78)">
      <path class="black" d="M98 28h166c56 0 83 28 83 83v143H52V72c0-24 21-44 46-44Z"/>
      <path d="M52 122c57-21 154 6 242 13 50 4 81 31 84 79l5 78H28V164c0-24 11-37 24-42Z" fill="#FFFFFF"/>
      <path class="black" d="M54 110c60-17 153 8 240 13 53 4 83 34 83 85v82H28V153c0-22 11-36 26-43Z"/>
      <path d="M28 229c67-23 158-15 240-25 75-9 119 21 119 76v49H28V229Z" fill="#FFFFFF"/>
      <path class="black" d="M28 217c70-20 157-12 239-22 78-9 120 22 120 78 0 53-34 78-88 78H82c-35 0-54-21-54-55v-79Z"/>
      <rect x="63" y="256" width="72" height="72" rx="20" fill="#FFFFFF"/>
      <path class="strokeBlack" d="M80 291l18 17 38-44"/>
    </g>
    <text x="58" y="342" class="label">D. Square Check</text>
    <text x="58" y="377" class="note">More checkbox-like, useful if the product cue must be unmistakable.</text>
  </g>

  <!-- E: more abstract but same stack -->
  <g transform="translate(652 715)">
    <g transform="translate(122 48) scale(0.78)">
      <path class="black" d="M100 30h166c55 0 82 28 82 82v142H54V74c0-24 20-44 46-44Z"/>
      <path d="M54 124c61-19 151 7 242 12 51 3 82 31 86 79l7 80H30V166c0-24 11-37 24-42Z" fill="#FFFFFF"/>
      <path class="black" d="M56 112c61-15 153 8 241 13 52 3 82 33 82 84v83H30V154c0-23 11-36 26-42Z"/>
      <path d="M30 231c68-22 157-14 239-24 75-10 118 21 118 76v47H30v-99Z" fill="#FFFFFF"/>
      <path class="black" d="M30 219c70-18 156-12 238-22 78-9 119 22 119 78 0 53-34 78-88 78H82c-35 0-52-21-52-54v-80Z"/>
      <path class="strokeWhite" d="M267 288l18 17 42-50"/>
    </g>
    <text x="58" y="342" class="label">E. Minimal Check</text>
    <text x="58" y="377" class="note">Keeps the check as a gesture rather than a separate UI control.</text>
  </g>

  <!-- F: compact app icon version -->
  <g transform="translate(1208 715)">
    <g transform="translate(122 48) scale(0.78)">
      <path class="black" d="M104 36h156c52 0 78 26 78 78v132H62V77c0-23 19-41 42-41Z"/>
      <path d="M62 126c54-18 142 8 224 14 47 3 75 28 79 73l6 70H38V166c0-21 10-34 24-40Z" fill="#FFFFFF"/>
      <path class="black" d="M64 114c57-15 144 8 224 14 48 3 76 31 76 77v76H38V156c0-20 10-34 26-42Z"/>
      <path d="M38 221c65-19 144-10 220-20 73-9 112 20 112 70v42H38v-92Z" fill="#FFFFFF"/>
      <path class="black" d="M38 209c65-17 144-9 219-18 72-8 112 19 112 70 0 49-32 73-82 73H87c-32 0-49-19-49-50v-75Z"/>
      <path class="strokeWhite" d="M82 267l29 28 63-70"/>
    </g>
    <text x="58" y="342" class="label">F. Compact Stack</text>
    <text x="58" y="377" class="note">Slightly tighter proportions for dock/app-icon usage.</text>
  </g>

  <line x1="96" y1="1218" x2="1704" y2="1218" stroke="#D9D9D9"/>
  <text x="96" y="1260" class="note">My read: A is the closest to your reference; B is the cleanest logo; F is the best app-icon proportion.</text>
</svg>
