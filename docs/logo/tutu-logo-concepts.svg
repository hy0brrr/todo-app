<svg width="1800" height="1350" viewBox="0 0 1800 1350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Tutu App black and white logo concept board</title>
  <rect width="1800" height="1350" fill="#F7F7F3"/>

  <style>
    .title { font: 700 54px -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0; fill: #050505; }
    .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0; fill: #4B4B48; }
    .label { font: 700 22px -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0; fill: #050505; }
    .note { font: 400 17px -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0; fill: #555552; }
    .word { font: 760 44px -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.5px; fill: #050505; }
    .card { fill: #FFFFFF; stroke: #DCDCD6; stroke-width: 1.4; }
    .mark { fill: #050505; }
    .stroke { stroke: #050505; stroke-width: 28; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <text x="96" y="104" class="title">Tutu App logo directions</text>
  <text x="98" y="145" class="subtitle">Pure black and white, abstract enough to read as a brand mark instead of a feature icon.</text>

  <!-- Card backgrounds -->
  <g>
    <rect x="96" y="210" width="496" height="468" rx="22" class="card"/>
    <rect x="652" y="210" width="496" height="468" rx="22" class="card"/>
    <rect x="1208" y="210" width="496" height="468" rx="22" class="card"/>
    <rect x="96" y="740" width="496" height="468" rx="22" class="card"/>
    <rect x="652" y="740" width="496" height="468" rx="22" class="card"/>
    <rect x="1208" y="740" width="496" height="468" rx="22" class="card"/>
  </g>

  <!-- A: Flow Gate -->
  <g transform="translate(96 210)">
    <g transform="translate(74 82)">
      <path class="mark" d="M54 63h75c11 0 19 4 27 13l55 62c13 15 34 8 34-12 0-14-1-29-2-42-1-13 8-21 21-21h71c12 0 22 5 31 14l77 77c7 7 11 16 11 26v45c0 15-12 27-27 27h-62c-12 0-22-4-30-13l-57-62c-13-14-34-7-34 12 0 13 1 28 2 42 1 14-8 23-22 23h-70c-13 0-23-5-32-14L38 157c-8-8-12-17-12-28V91c0-16 12-28 28-28Z"/>
      <rect class="mark" x="0" y="150" width="66" height="66" rx="18"/>
    </g>
    <text x="58" y="370" class="label">A. Flow Gate</text>
    <text x="58" y="405" class="note">A folded path: capture, route, complete.</text>
  </g>

  <!-- B: Nested Loop -->
  <g transform="translate(652 210)">
    <g transform="translate(116 82)">
      <path d="M70 89c29-31 75-47 121-35 63 17 100 82 83 145-14 52-62 86-114 86" stroke="#050505" stroke-width="31" stroke-linecap="round"/>
      <path d="M218 211c-29 31-75 47-121 35C34 229-3 164 14 101c14-52 62-86 114-86" stroke="#050505" stroke-width="31" stroke-linecap="round"/>
      <rect class="mark" x="117" y="116" width="54" height="54" rx="16" transform="rotate(45 144 143)"/>
    </g>
    <text x="58" y="370" class="label">B. Nested Loop</text>
    <text x="58" y="405" class="note">Parent-child hierarchy as one continuous system.</text>
  </g>

  <!-- C: Step Signal -->
  <g transform="translate(1208 210)">
    <g transform="translate(110 105)">
      <rect class="mark" x="0" y="106" width="54" height="54" rx="4"/>
      <rect class="mark" x="54" y="52" width="54" height="54" rx="4"/>
      <rect class="mark" x="108" y="106" width="54" height="54" rx="4"/>
      <rect class="mark" x="162" y="106" width="118" height="54" rx="4"/>
      <rect class="mark" x="54" y="0" width="54" height="54" rx="4"/>
      <path class="mark" d="M214 52h66v54h-38c-15 0-28-12-28-28V52Z"/>
    </g>
    <text x="58" y="370" class="label">C. Step Signal</text>
    <text x="58" y="405" class="note">Partitions and priority reduced to a modular wordless sign.</text>
  </g>

  <!-- D: Twin Cut -->
  <g transform="translate(96 740)">
    <g transform="translate(118 78)">
      <defs>
        <mask id="twinCutMask">
          <rect x="0" y="0" width="260" height="260" fill="white"/>
          <rect x="50" y="53" width="160" height="42" rx="21" fill="black"/>
          <path d="M86 78v72c0 35 25 58 57 58s57-23 57-58V78" stroke="black" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="143" cy="150" r="20" fill="white"/>
        </mask>
      </defs>
      <rect class="mark" x="20" y="28" width="220" height="204" rx="54" mask="url(#twinCutMask)"/>
      <circle class="mark" cx="47" cy="59" r="25"/>
      <circle class="mark" cx="213" cy="201" r="25"/>
    </g>
    <text x="58" y="370" class="label">D. Twin Cut</text>
    <text x="58" y="405" class="note">A quiet monogram: two T/U rhythms hidden in mass.</text>
  </g>

  <!-- E: Split Field -->
  <g transform="translate(652 740)">
    <g transform="translate(130 78)">
      <defs>
        <mask id="splitFieldMask">
          <rect x="0" y="0" width="260" height="260" fill="white"/>
          <path d="M60 35 168 225" stroke="black" stroke-width="24" stroke-linecap="round"/>
          <path d="M98 35 206 225" stroke="black" stroke-width="24" stroke-linecap="round"/>
          <path d="M136 35 244 225" stroke="black" stroke-width="24" stroke-linecap="round"/>
        </mask>
      </defs>
      <circle class="mark" cx="130" cy="130" r="112" mask="url(#splitFieldMask)"/>
      <rect class="mark" x="82" y="102" width="96" height="56" rx="18" transform="rotate(-18 130 130)"/>
    </g>
    <text x="58" y="370" class="label">E. Split Field</text>
    <text x="58" y="405" class="note">Tag-like slices and focus, kept intentionally nonliteral.</text>
  </g>

  <!-- F: Tutu Loop -->
  <g transform="translate(1208 740)">
    <g transform="translate(116 88)">
      <path d="M46 53v83c0 52 39 86 89 86s89-34 89-86V53" stroke="#050505" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M100 53v85c0 21 15 36 35 36s35-15 35-36V53" stroke="#050505" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="mark" x="20" y="31" width="230" height="44" rx="22"/>
      <circle cx="135" cy="140" r="18" fill="#F7F7F3"/>
    </g>
    <text x="58" y="370" class="label">F. Tutu Loop</text>
    <text x="58" y="405" class="note">The name itself becomes a compact double-loop rhythm.</text>
  </g>

  <!-- Inverse quick test strip -->
  <rect x="96" y="1260" width="1608" height="1" fill="#DCDCD6"/>
  <text x="96" y="1304" class="note">Early read: B and D feel most logo-like; A feels closest to product flow; C is the boldest small-size mark.</text>
</svg>
